name: Latido de Supabase

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad (por ejemplo, en
# vacaciones). Una vez por semana se toca la base con una función que no lee datos.
on:
  schedule:
    - cron: "17 12 * * 1" # lunes 9:17 en Argentina
  workflow_dispatch:

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Llamar a public.latido()
        run: |
          set -a; . ./.env; set +a
          curl --fail-with-body -sS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/latido" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
