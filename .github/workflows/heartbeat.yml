name: Supabase heartbeat

# Supabase's free plan pauses the project after 7 days without activity (for example, on
# vacation). Once a week the database is touched with a function that reads no data.
on:
  schedule:
    - cron: "17 12 * * 1" # Monday 9:17 in Argentina
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Call public.heartbeat()
        run: |
          set -a; . ./.env; set +a
          curl --fail-with-body -sS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/heartbeat" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
